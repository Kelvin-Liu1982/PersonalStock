:root{

  --acc:#c8102e;--acc2:#15616d;--ok:#2e9e6b;--warn:#d98a14;--todo:#9aa6b2;--soft:#f7f9fb;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.6;min-height:100vh
}

main{max-width:1180px;margin:0 auto;padding:60px 22px 90px;text-align:center}
h1{font-size:26px;font-weight:700;margin-bottom:8px;letter-spacing:.5px}
.lead{color:var(--dim);font-size:14px;margin-bottom:44px}

.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
@media (max-width:900px){.actions{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.actions{grid-template-columns:1fr}}

/* ===== 大宗商品分析 · 快捷小卡（置顶，独立于标的卡片） ===== */
.quicklinks{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:0 0 32px;text-align:left}
@media (max-width:900px){.quicklinks{grid-template-columns:repeat(2,1fr)}}
@media (max-width:700px){.quicklinks{grid-template-columns:1fr}}
.qcard{
  --cat:var(--acc2);
  display:flex;align-items:center;gap:12px;padding:14px 18px;
  background:var(--card);border:1px solid var(--line);
  border-left:4px solid var(--cat);border-radius:12px;
  box-shadow:0 2px 6px rgba(20,30,50,.05);
  text-decoration:none;color:var(--ink);
  transition:transform .15s,box-shadow .15s,border-color .15s;
}
.qcard:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(20,30,50,.1);border-color:var(--cat)}
.qcard .q-tag{
  flex:none;font-size:11px;line-height:1;color:#fff;
  background:var(--cat);padding:5px 9px;border-radius:10px;white-space:nowrap;
}
.qcard .q-body{display:flex;flex-direction:column;flex:1;min-width:0}
.qcard .q-name{font-size:15px;font-weight:700;line-height:1.35}
.qcard .q-desc{
  font-size:12px;color:var(--dim);line-height:1.4;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.qcard .q-arrow{flex:none;color:var(--dim);font-size:15px;transition:transform .15s,color .15s}
.qcard:hover .q-arrow{color:var(--cat);transform:translateX(2px)}
</style>
</head>
