<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>业绩追踪看板</title>
<style>
:root{
  --bg:#f4f6f8;--card:#fff;--line:#e3e8ee;--ink:#1f2733;--dim:#7a8694;
  --acc:#c8102e;--acc2:#15616d;--ok:#2e9e6b;--warn:#d98a14;--todo:#9aa6b2;--soft:#f7f9fb;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.6;min-height:100vh}

header.top{background:var(--card);border-bottom:1px solid var(--line);padding:18px 28px;position:sticky;top:0;z-index:10;box-shadow:0 1px 4px rgba(20,30,50,.04)}
.meta{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.meta span{background:#fff;color:var(--dim);padding:6px 14px;border-radius:16px;font-size:13px;border:1px solid var(--line);white-space:nowrap}

main{max-width:720px;margin:0 auto;padding:60px 22px 90px;text-align:center}
h1{font-size:26px;font-weight:700;margin-bottom:8px;letter-spacing:.5px}
.lead{color:var(--dim);font-size:14px;margin-bottom:44px}

.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.actions a{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:34px 24px;text-decoration:none;color:var(--ink);
  box-shadow:0 2px 6px rgba(20,30,50,.05);transition:transform .15s,box-shadow .15s,border-color .15s
}
.actions a:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(20,30,50,.1);border-color:var(--acc2)}
.actions .name{font-size:20px;font-weight:700;margin-bottom:6px}
.actions .code{font-size:12px;color:var(--dim)}
.actions .arrow{margin-top:16px;font-size:18px;color:var(--acc2)}

footer.foot2{margin-top:60px;text-align:center;color:var(--todo);font-size:11px}
</style>
</head>
<body>
<header class="top">
  <div class="meta">
    <span>编制日期：2026-08-09</span>
    <span>方法论：高频跟踪 + 季度验证 + 情景假设</span>
    <span>频率分层：日·周·月·季·事件</span>
  </div>
</header>

<main>
  <h1>业绩追踪看板</h1>
  <p class="lead">点击下方入口进入对应标的追踪页面</p>

  <div class="actions">
    <a href="./中煤能源业务追踪/中煤能源业务追踪监测清单.html">
      <span class="name">中煤能源</span>
      <span class="code">601898.SH / 01898.HK</span>
      <span class="arrow">→</span>
    </a>
    <a href="./中远海控追踪框架/中远海控追踪看板(方向C).html">
      <span class="name">中远海控</span>
      <span class="code">601919.SH / 01919.HK</span>
      <span class="arrow">→</span>
    </a>
  </div>
</main>

<footer class="foot2">业绩追踪看板 · 一级导航页</footer>
</body>
</html>
