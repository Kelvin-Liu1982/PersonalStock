name = "personalstock"
compatibility_date = "2025-04-01"

# Browser Rendering 绑定（方案4 试点）已暂时移除：
# 该绑定要求 Workers 付费版，免费版声明会导致**整个构建失败**（站点停留在旧版本）。
# worker/index.js 中的 handleNews() 保留，未绑定时 /api/news 返回 501 并说明原因，
# 前端据此自动回落到仓库内已发布快照（../data/dataset/news.json）。
# 升级 Workers Paid 后，取消下面两行注释即可重启方案4：
# [browser]
# binding = "BROWSER"

# Worker 入口：处理 /api/quote（行情）、/api/fred、/api/eia（宏观代理）、
# /api/news（快讯，需 Browser Rendering，未绑定则 501），其余请求回落静态资源
main = "worker/index.js"

# ⚠️ 宏观代理所需密钥**不写在此文件**（本仓库公开），须在 Cloudflare Dashboard 配置为
# 加密变量：Workers & Pages → personalstock → Settings → Variables and Secrets
#   FRED_KEY  = <fred.stlouisfed.org 的 32 位 api key>
#   EIA_KEY   = <eia.gov 的 api key>
# 或本地执行：npx wrangler secret put FRED_KEY / EIA_KEY
# 未配置时 /api/fred、/api/eia 返回 501，看板回落已烘焙的快照数据（页面不报错）。

# 将整个仓库根作为静态资源目录
# 根 index.html 会作为站点首页
# cosco-shipping/ 与 china-coal/ 等子目录按原路径访问；
# 中远海控页面已收拢到 cosco-shipping/output/，根 index.html 的卡片链接已同步
assets = { directory = "." }
